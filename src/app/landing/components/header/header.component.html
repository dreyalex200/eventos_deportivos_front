<header class="header" [ngClass]="{ 'scrolled': isScrolled() }">
  <div class="container header-container">
    <!-- Brand Logo -->
    <a href="#" class="brand" (click)="closeMobileMenu()">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">SportFlow</span>
        <span class="brand-subtitle">Plataforma de Eventos</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav" aria-label="Navegación principal">
      <a href="#features">Características</a>
      <a href="#how-it-works">Cómo Funciona</a>
      <a href="#sports">Deportes</a>
      <a href="#rules">Reglamentos</a>
      <a href="#about">Acerca de</a>
      <a href="#contact">Contacto</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <a routerLink="/login" class="btn btn-primary nav-cta">
        Iniciar Sesión
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-toggle" [ngClass]="{ 'active': isMobileMenuOpen() }" (click)="toggleMobileMenu()"
        aria-label="Alternar menú de navegación">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="mobile-menu" [ngClass]="{ 'open': isMobileMenuOpen() }">
    <nav aria-label="Navegación móvil">
      <a href="#features" (click)="closeMobileMenu()">Características</a>
      <a href="#how-it-works" (click)="closeMobileMenu()">Cómo Funciona</a>
      <a href="#sports" (click)="closeMobileMenu()">Deportes</a>
      <a href="#rules" (click)="closeMobileMenu()">Reglamentos</a>
      <a href="#about" (click)="closeMobileMenu()">Acerca de</a>
      <a href="#contact" (click)="closeMobileMenu()">Contacto</a>
      <div class="mobile-cta-wrapper">
        <a routerLink="/login" class="btn btn-primary full-width" (click)="closeMobileMenu()">
          Iniciar Sesión
        </a>
      </div>
    </nav>
  </div>
</header>
