<header class="header" [ngClass]="{ 'scrolled': isScrolled() }">
  <div class="container header-container">
    <!-- Brand Logo -->
    <a href="#" class="brand" (click)="closeMobileMenu()">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">SportFlow</span>
        <span class="brand-subtitle">Events Platform</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav" aria-label="Main Navigation">
      <a href="#features">Features</a>
      <a href="#how-it-works">How It Works</a>
      <a href="#sports">Sports</a>
      <a href="#rules">Rules</a>
      <a href="#about">About Platform</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <a routerLink="/login" class="btn btn-primary nav-cta">
        Login
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-toggle" [ngClass]="{ 'active': isMobileMenuOpen() }" (click)="toggleMobileMenu()"
        aria-label="Toggle Navigation Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="mobile-menu" [ngClass]="{ 'open': isMobileMenuOpen() }">
    <nav aria-label="Mobile Navigation">
      <a href="#features" (click)="closeMobileMenu()">Features</a>
      <a href="#how-it-works" (click)="closeMobileMenu()">How It Works</a>
      <a href="#sports" (click)="closeMobileMenu()">Sports</a>
      <a href="#rules" (click)="closeMobileMenu()">Rules</a>
      <a href="#about" (click)="closeMobileMenu()">About Platform</a>
      <a href="#contact" (click)="closeMobileMenu()">Contact</a>
      <div class="mobile-cta-wrapper">
        <a routerLink="/login" class="btn btn-primary full-width" (click)="closeMobileMenu()">
          Login
        </a>
      </div>
    </nav>
  </div>
</header>
