<section class="workflow-section">
  <div class="container">
    <div class="section-header">
      <div class="section-badge">Proceso Optimizado</div>
      <h2>Flujo de Competencia Claro en 10 Pasos</h2>
      <p>
        Desde la configuración inicial hasta la premiación final, SportFlow guía a los organizadores a través de un flujo operativo intuitivo.
      </p>
    </div>

    <!-- Timeline Grid -->
    <div class="timeline-container">
      <div class="timeline-line"></div>
      <div class="steps-grid">
        @for (step of steps; track step.num) {
          <div class="timeline-card">
            <div class="step-badge">{{ step.num }}</div>
            <div class="card-content">
              <h3 class="step-title">{{ step.title }}</h3>
              <p class="step-desc">{{ step.desc }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
